# ==============================================================================
# Pakan Ikan - Nginx Reverse Proxy Configuration (Single-VM Architecture)
# ==============================================================================
# Domain: pakan-ikan.my.id
# VM Internal IP: 192.168.1.115
# Upstream Backend: 127.0.0.1:5000 (Node.js Express)
# Frontend Static Root: /var/www/pakan-ikan/dist
#
# Topology:
# Cloudflare Tunnel -> http://192.168.1.115:80 -> Nginx ->
#   ├── / (SPA Frontend)
#   └── /api/* (Internal Proxy to 127.0.0.1:5000)
# ==============================================================================

# Upstream definition for Express IoT Backend
upstream pakan_ikan_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name pakan-ikan.my.id 192.168.1.115 localhost;

    # Root directory for Vite React SPA production build
    root /var/www/pakan-ikan/dist;
    index index.html;

    # Client body limit (allows telemetries and typical payloads)
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # 1. API Reverse Proxy -> Loopback Express Backend (127.0.0.1:5000)
    # Covers: /api/health, /api/auth/*, /api/v1/*
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://pakan_ikan_backend;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ensure Authorization & custom headers reach Express
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_pass_header X-Device-Key;
        proxy_pass_header X-Device-Id;

        # Timeouts and buffer settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }

    # --------------------------------------------------------------------------
    # 2. Static Asset Caching (Hashed files from Vite build)
    # --------------------------------------------------------------------------
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff2|woff)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 3. Frontend Single Page Application (SPA) Routing Fallback
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # 4. Error pages
    # --------------------------------------------------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
