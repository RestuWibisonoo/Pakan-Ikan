<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Glass Badge Gradient persis seperti di AuthLayout login -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <!-- Fish Stroke Gradient (#38bdf8 to #7dd3fc) -->
    <linearGradient id="fishColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0ea5e9" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- 1. Background Penuh (Safe for Android Maskable Icons) -->
  <rect width="512" height="512" rx="115" fill="url(#darkBg)" />

  <!-- 2. Kotak Badge Glassmorphism (Persis container login) -->
  <rect x="86" y="86" width="340" height="340" rx="88" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.45" filter="url(#cyanGlow)" />

  <!-- 3. Icon Ikan Lucide Fish (#38bdf8) -->
  <!-- Viewbox Lucide 24x24 di-scale 10.5x menjadi 252x252, centered at (256, 256) -->
  <!-- 256 - 12 * 10.5 = 130 -->
  <g transform="translate(130, 130) scale(10.5)" fill="none" stroke="url(#fishColor)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.47-3.44 6-7 6s-7.56-2.53-8.5-6Z" />
    <path d="M18 12v.5" />
    <path d="M16 17.93a9.77 9.77 0 0 1 0-11.86" />
    <path d="M7 10.67C7 8 5.58 5.97 2.73 5.5c-1 1.5-1 5 .23 6.5-1.24 1.5-1.24 5-.23 6.5C5.58 18.03 7 16 7 13.33" />
    <path d="M10.46 7.26C10.2 5.88 9.17 4.24 8 3h5.8a2 2 0 0 1 1.98 1.67l.23 1.4" />
    <path d="m16.01 17.93-.23 1.4A2 2 0 0 1 13.8 21H9.5a5.96 5.96 0 0 0 1.49-3.98" />
  </g>
</svg>